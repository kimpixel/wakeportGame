# Cloudflare Worker der Rangliste (siehe server/README.md)
name = "wakethehack-rangliste"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Browser-Seiten, die die Rangliste aufrufen dürfen (localhost ist immer erlaubt)
ALLOWED_ORIGINS = "https://kimpixel.github.io"

[[d1_databases]]
binding = "DB"
database_name = "wakethehack"
# nach "npx wrangler d1 create wakethehack" die ausgegebene database_id hier eintragen
database_id = "017bfa67-92ac-43b3-832d-6517d63cfda0"
