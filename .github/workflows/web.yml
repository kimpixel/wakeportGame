# Baut die Web-Version und veröffentlicht sie auf GitHub Pages (Branch gh-pages):
# - Push auf main     -> Hauptversion  https://kimpixel.github.io/wakeportGame/
# - Pull Request      -> Vorschau      https://kimpixel.github.io/wakeportGame/pr-preview/pr-<Nummer>/
#                        (Link kommt als Kommentar in den PR, wird bei jedem Push aktualisiert,
#                        beim Schließen des PRs wieder gelöscht)
name: Web-Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

# Standard nur lesen; Schreibrechte bekommen nur die Jobs, die auf gh-pages schreiben bzw. den PR kommentieren
permissions:
  contents: read

# Je PR bzw. Branch eine Gruppe. Nicht github.ref allein: beim Schließen eines gemergten PRs ist das
# refs/heads/main, und der Lauf hat dann den Build der Hauptversion abgebrochen.
concurrency:
  group: web-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  # SHA-512 aus SHA512-SUMS.txt des Godot-Releases (bei neuer Version mit anpassen)
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

jobs:
  build:
    # PRs aus Forks bekommen keine Schreibrechte -> keine Vorschau
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Godot und Export-Templates laden
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          cd "$RUNNER_TEMP"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_SHA512}  Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" | sha512sum -c -
          echo "${TEMPLATES_SHA512}  Godot_v${GODOT_VERSION}-stable_export_templates.tpz" | sha512sum -c -
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # Versionsnummer unten rechts im Spiel (scripts/ui/branch_label.gd liest res://version.txt)
      - name: Versionsnummer
        run: |
          sha=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          pr="${{ github.event.pull_request.number }}"
          echo "BUILD_ID=${GITHUB_RUN_NUMBER}-${sha}" >> "$GITHUB_ENV"
          echo "v${GITHUB_RUN_NUMBER} · ${sha}${pr:+ · PR $pr}" > version.txt
          cat version.txt

      - name: Projekt importieren
        run: timeout 300 "$RUNNER_TEMP/godot" --headless --import --path . || true

      - name: Web-Export
        run: |
          mkdir -p build/web
          "$RUNNER_TEMP/godot" --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          test -f build/web/index.wasm

      # Spiel-Musik (assets/music/, .gdignore: nicht im Spielpaket) als einzelne Dateien daneben legen,
      # das Spiel lädt sie nach (scripts/music.gd); index.json = Liste der Dateinamen
      - name: Spiel-Musik
        run: |
          mkdir -p build/web/music
          shopt -s nullglob nocaseglob
          files=()
          for f in assets/music/*.mp3 assets/music/*.ogg assets/music/*.wav; do
            cp "$f" build/web/music/
            files+=("$(basename "$f")")
          done
          node -e "console.log(JSON.stringify(process.argv.slice(1)))" -- "${files[@]}" > build/web/music/index.json
          cat build/web/music/index.json

      # Cache am Handy umgehen: Spieldaten (index.pck) je Build unter neuem Namen, index.js mit ?v=,
      # build.txt für den Versions-Check in index.html (head_include in export_presets.cfg: lädt die
      # Seite einmal neu, wenn der Browser noch eine alte index.html aus dem Cache zeigt)
      - name: Cache-Busting
        run: |
          cd build/web
          mv index.pck "index-${BUILD_ID}.pck"
          sed -i \
            -e "s/\"index\.pck\"/\"index-${BUILD_ID}.pck\"/g" \
            -e "s/GODOT_CONFIG = {/GODOT_CONFIG = {\"mainPack\":\"index-${BUILD_ID}.pck\",/" \
            -e "s/src=\"index\.js\"/src=\"index.js?v=${BUILD_ID}\"/" \
            -e "s/__BUILD_ID__/${BUILD_ID}/g" \
            index.html
          echo "${BUILD_ID}" > build.txt
          grep -q "mainPack\":\"index-${BUILD_ID}.pck" index.html
          grep -q "index.js?v=${BUILD_ID}" index.html
          ls -la

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: build/web
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Immer nur ein Schreiber auf gh-pages, nichts abbrechen
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: build/web

      - name: Hauptversion veröffentlichen
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: build/web
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

      - name: PR-Vorschau veröffentlichen
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: build/web
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

  remove-preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PR-Vorschau löschen
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
