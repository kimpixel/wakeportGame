# Baut die Web-Version und veröffentlicht sie auf GitHub Pages (Branch gh-pages):
# - Push auf main     -> Hauptversion  https://kimpixel.github.io/wakeportGame/
# - Pull Request      -> Vorschau      https://kimpixel.github.io/wakeportGame/pr-preview/pr-<Nummer>/
#                        (Link kommt als Kommentar in den PR, wird bei jedem Push aktualisiert,
#                        beim Schließen des PRs wieder gelöscht)
name: Web-Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Je PR bzw. Branch eine Gruppe. Nicht github.ref allein: beim Schließen eines gemergten PRs ist das
# refs/heads/main, und der Lauf hat dann den Build der Hauptversion abgebrochen.
concurrency:
  group: web-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    # PRs aus Forks bekommen keine Schreibrechte -> keine Vorschau
    if: >-
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot und Export-Templates laden
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          cd "$RUNNER_TEMP"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # Versionsnummer unten rechts im Spiel (scripts/ui/branch_label.gd liest res://version.txt)
      - name: Versionsnummer
        run: |
          sha=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          pr="${{ github.event.pull_request.number }}"
          echo "BUILD_ID=${GITHUB_RUN_NUMBER}-${sha}" >> "$GITHUB_ENV"
          echo "v${GITHUB_RUN_NUMBER} · ${sha}${pr:+ · PR $pr}" > version.txt
          cat version.txt

      - name: Projekt importieren
        run: timeout 300 "$RUNNER_TEMP/godot" --headless --import --path . || true

      - name: Web-Export
        run: |
          mkdir -p build/web
          "$RUNNER_TEMP/godot" --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          test -f build/web/index.wasm

      # Cache am Handy umgehen: Spieldaten (index.pck) je Build unter neuem Namen, index.js mit ?v=,
      # build.txt für den Versions-Check in index.html (head_include in export_presets.cfg: lädt die
      # Seite einmal neu, wenn der Browser noch eine alte index.html aus dem Cache zeigt)
      - name: Cache-Busting
        run: |
          cd build/web
          mv index.pck "index-${BUILD_ID}.pck"
          sed -i \
            -e "s/\"index\.pck\"/\"index-${BUILD_ID}.pck\"/g" \
            -e "s/GODOT_CONFIG = {/GODOT_CONFIG = {\"mainPack\":\"index-${BUILD_ID}.pck\",/" \
            -e "s/src=\"index\.js\"/src=\"index.js?v=${BUILD_ID}\"/" \
            -e "s/__BUILD_ID__/${BUILD_ID}/g" \
            index.html
          echo "${BUILD_ID}" > build.txt
          grep -q "mainPack\":\"index-${BUILD_ID}.pck" index.html
          grep -q "index.js?v=${BUILD_ID}" index.html
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Immer nur ein Schreiber auf gh-pages, nichts abbrechen
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: build/web

      - name: Hauptversion veröffentlichen
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

      - name: PR-Vorschau veröffentlichen
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: build/web
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy

  remove-preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: PR-Vorschau löschen
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
