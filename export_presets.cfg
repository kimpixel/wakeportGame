html/custom_html_shell=""
html/head_include="<script>
/* Ton auf dem Handy: mobile Browser starten Web-Audio erst nach einer Berührung (iOS nur bei touchend).
   Merkt sich die AudioContexts der Engine und setzt sie bei einer Berührung fort; auf iOS 17+
   spielt der Ton dank audioSession 'playback' auch bei aktivem Stummschalter.
   Läuft der Ton, hört das Skript auf zu lauschen (sonst bremst es bei jedem Tastendruck).
   Nur auf Touch-Geräten aktiv – am Desktop bleibt alles wie von Godot vorgesehen. */
(function () {
	if (!(navigator.maxTouchPoints > 0)) return;
	var ctxs = [];
	var AC = window.AudioContext || window.webkitAudioContext;
	if (AC) {
		var Tracked = function (opts) { var c = new AC(opts); ctxs.push(c); return c; };
		Tracked.prototype = AC.prototype;
		window.AudioContext = Tracked;
		if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
	}
	var events = ['touchend', 'click', 'keydown'];
	var listening = false;
	function allRunning() {
		return ctxs.length > 0 && ctxs.every(function (c) { return c.state === 'running'; });
	}
	function stop() {
		if (!listening) return;
		listening = false;
		events.forEach(function (t) { window.removeEventListener(t, unlock, true); });
	}
	function unlock() {
		if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (e) {} }
		ctxs.forEach(function (c) {
			if (c.state === 'running') return;
			c.resume().then(function () { if (allRunning()) stop(); }, function () {});
			try {
				var s = c.createBufferSource();
				s.buffer = c.createBuffer(1, 1, 22050);
				s.connect(c.destination);
				s.start(0);
			} catch (e) {}
		});
		if (allRunning()) stop();
	}
	function listen() {
		if (listening) return;
		listening = true;
		events.forEach(function (t) { window.addEventListener(t, unlock, true); });
	}
	listen();
	/* nach Anruf, Sperrbildschirm oder App-Wechsel wieder freischalten */
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden && !allRunning()) listen();
	});
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
